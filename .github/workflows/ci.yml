name: Test and container
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this tested revision after privacy review
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-test.lock && python -m pip install --no-deps -e .
      - run: python -m pytest -q
  container:
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build pinned browser container
        run: docker build --tag taobao-buyer-api:ci .
      - name: Load dedicated browser AppArmor profile
        run: sudo apparmor_parser -r sandbox/chromium-apparmor
      - name: Verify sandbox without network access
        run: >-
          docker run --rm --init --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges=true
          --security-opt seccomp=sandbox/chromium-seccomp.json
          --security-opt apparmor=taobao-buyer-chromium
          --tmpfs /tmp:uid=10001,gid=10001,mode=1770
          --tmpfs /home/buyer:uid=10001,gid=10001,mode=0700
          --shm-size=256m taobao-buyer-api:ci python scripts/sandbox_check.py
      - name: Verify browser workflows with synthetic pages
        run: >-
          docker run --rm --init --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges=true
          --security-opt seccomp=sandbox/chromium-seccomp-oci.json
          --security-opt apparmor=taobao-buyer-chromium
          --tmpfs /tmp:uid=10001,gid=10001,mode=1770
          --tmpfs /home/buyer:uid=10001,gid=10001,mode=0700
          --shm-size=256m taobao-buyer-api:ci python scripts/offline_check.py
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          docker tag taobao-buyer-api:ci "ghcr.io/kitsunies/taobao-buyer-api:$RELEASE_SHA"
          docker push "ghcr.io/kitsunies/taobao-buyer-api:$RELEASE_SHA"
